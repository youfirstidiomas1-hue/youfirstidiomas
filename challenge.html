<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafios | You First Idiomas</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
  :root {
  --plum: #2c0439;
  --plum-deep: #16001d;
  --gold: #ffd700;
  --lavender: #e2d1f0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  width: 100%;
  min-height: 100vh;
  font-family: "DM Sans", sans-serif;
  color: var(--lavender);
  background-color: #2c0439;
}

/* Contenedor wrapper principal */
.app-shell {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow: x-hidden;
  background:
    radial-gradient(circle at 10% 5%, rgba(255, 215, 0, .13), transparent 25rem),
    radial-gradient(circle at 87% 70%, rgba(158, 86, 195, .22), transparent 28rem),
    #2c0439;
}

/* Malla de cuadrícula superior */
.app-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .23;
  background-image:
    linear-gradient(rgba(255, 215, 0, .07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 215, 0, .07) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: linear-gradient(to bottom, black, transparent 70%);
}

  .content-frame {
    position: relative;
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 26px 24px 42px;
  }

  .glass-panel {
    background: rgba(20, 3, 29, .72);
    border: 1px solid rgba(255, 215, 0, .58);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .24);
    backdrop-filter: blur(14px);
  }

    .nav-link {
      color: #e2d1f0;
      transition: color .2s ease, background .2s ease;
    }

    .nav-link:hover, .nav-link:focus-visible {
      color: #ffd700;
      background: rgba(255, 215, 0, .09);
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      min-height: 46px;
      border-radius: .7rem;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .action-button:hover { transform: translateY(-2px); filter: brightness(1.06); }

    .gold-line {
      width: 44px;
      height: 2px;
      background: #ffd700;
      border-radius: 99px;
    }

    .card-hover {
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      border-color: #ffd700;
      background: rgba(53, 12, 66, .9);
    }
</head>
<body>

  <!-- Mismo Header Unificado -->
  <header class="header-nav">
    <a href="index.html" class="header-brand">
      <img src="assets/logo.png" alt="You First Idiomas Logo" class="header-logo-img">
    </a>

    <nav>
      <ul class="header-menu">
        <li><a href="index.html#cursos" class="nav-link">Programas</a></li>

        <li><a href="aluno.html" class="nav-link nav-btn-highlight">Área do Aluno</a></li>
      </ul>
    </nav>
  </header>

  <div class="challenge-container">
    <h1 class="challenge-title">Admission Challenge: Você tem o perfil Premium?</h1>

    <div class="question-card active" data-question="0">

      <div class="question-text">Disciplina: Você consegue manter uma rotina mínima de contato com o idioma?</div>

      <button class="next-button" id="next-0" onclick="nextQuestion()">Próxima Pergunta →</button>

    <div class="question-card" data-question="3">

      <div class="question-number">Pergunta 5 de 5</div>

      <div class="feedback" id="feedback-4"></div>
      <button class="next-button" id="next-4" onclick="nextQuestion()">Ver Resultado →</button>
    </div>

    <div class="result-card" id="result-card">
      <h2 class="result-title" id="result-title"></h2>
      <h3 class="result-subtitle" id="result-subtitle"></h3>

      <a href="https://www.youfirstidiomas.com/onboarding" class="cta-button" target="_blank" rel="noopener">Comece agora!</a>
    </div>
  </div>

  <script src="challenge.js"></script>
</body>
</html>
