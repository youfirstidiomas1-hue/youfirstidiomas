<!doctype html>
<html lang="pt-BR">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | You First Idiomas</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
   :root {
  --plum: #2c0439;
  --plum-deep: #16001d;
  --gold: #ffd700;
  --lavender: #e2d1f0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  font-family: "DM Sans", sans-serif;
  color: var(--lavender);
  background-color: #2c0439;
}

/* GRADIENTE GLOBAL DE FONDO */
.app-shell {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background: 
    radial-gradient(circle at 10% 8%, rgba(255, 215, 0, 0.22) 0%, transparent 35rem),
    radial-gradient(circle at 90% 60%, rgba(158, 86, 195, 0.35) 0%, transparent 38rem),
    #2c0439;
  background-attachment: fixed;
}

.app-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.20;
  background-image:
    linear-gradient(rgba(255, 215, 0, .08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 215, 0, .08) 1px, transparent 1px);
  background-size: 42px 42px;
}

/* HEADER TRANSPARENTE CON GLASSMORPHISM */
.header-nav {
  width: 100%;
  background: rgba(22, 0, 29, 0.75);
  backdrop-filter: blur(12px);
  padding: 18px 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255, 215, 0, 0.4);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.header-brand { display: flex; align-items: center; text-decoration: none; }
.header-logo-img { height: 55px; width: auto; object-fit: contain; }
.header-menu { display: flex; align-items: center; gap: 25px; list-style: none; margin: 0; padding: 0; }

.nav-link {
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  font-size: 16px;
  padding: 8px 16px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.3s ease;
}

.nav-link:hover { color: #ffd700; }

.nav-btn-highlight {
  background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
  color: #2c0439;
  font-weight: 800;
  border-radius: 25px;
  padding: 10px 22px;
  text-transform: uppercase;
  box-shadow: 0 2px 10px rgba(255, 215, 0, 0.2);
}

.nav-btn-highlight:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
}

/* SECCIONES TRANSPARENTES PARA MOSTRAR EL GRADIENTE */
.hero-section {
  background: transparent;
  padding: 60px 20px;
  text-align: center;
}

.hero-container { max-width: 900px; margin: 0 auto; }
.hero-text { font-size: 20px; font-weight: 600; color: #ffffff; margin-bottom: 40px; }

.courses-grid { 
  display: grid; 
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
  gap: 30px; 
}

/* TARJETAS GLASSMORPHISM */
.course-card {
  background: rgba(22, 0, 29, 0.65);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 215, 0, 0.35);
  text-align: center;
  transition: transform 0.3s ease, border-color 0.3s ease;
}

.course-card:hover {
  transform: translateY(-5px);
  border-color: #ffd700;
}

.course-img {
  width: 100%;
  height: auto;
  border-radius: 12px;
  margin-bottom: 15px;
  object-fit: cover;
}

.course-card h3 { font-size: 22px; color: #ffd700; margin-bottom: 10px; }

.beyond-section { 
  background: transparent;
  padding: 60px 20px; 
  max-width: 850px; 
  margin: 0 auto; 
  text-align: center;
}

.beyond-title { font-size: 30px; font-weight: 800; color: #ffd700; margin-bottom: 20px; }
.beyond-text { font-size: 17px; color: #e2d1f0; line-height: 1.7; }

.premium-section {
  background: rgba(22, 0, 29, 0.4);
  color: #ffffff;
  padding: 60px 20px;
  border-top: 1px solid rgba(255, 215, 0, 0.2);
}

.premium-container { max-width: 800px; margin: 0 auto; }
.premium-title-img { display: block; max-width: 100%; height: auto; margin: 0 auto 30px auto; }
.premium-subtitle { font-size: 20px; font-weight: 700; text-align: center; color: #ffd700; margin-bottom: 30px; }
.premium-desc { font-size: 16px; margin-bottom: 40px; text-align: justify; color: #f1e4f7; }
.premium-list-title { color: #ffd700; font-size: 18px; font-weight: 700; margin-bottom: 20px; }
.premium-list { list-style: none; padding: 0; }
.premium-list li { margin-bottom: 20px; font-size: 15px; line-height: 1.6; color: #e2d1f0; }
.premium-list strong { color: #ffffff; font-weight: 700; }

.btn-challenge {
  display: block;
  width: 100%;
  max-width: 400px;
  margin: 40px auto 0 auto;
  padding: 18px;
  background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
  color: #2c0439;
  text-align: center;
  text-decoration: none;
  font-weight: 800;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
  transition: transform 0.2s ease;
}

.btn-challenge:hover { transform: translateY(-2px); }

.coach-section {
  background: rgba(22, 0, 29, 0.5);
  padding: 80px 20px;
  border-top: 1px solid rgba(255, 215, 0, 0.2);
}

.coach-container { max-width: 850px; margin: 0 auto; text-align: center; }
.coach-title { font-size: 32px; font-weight: 800; color: #ffd700; margin-bottom: 25px; }
.coach-text { font-size: 17px; color: #e2d1f0; line-height: 1.8; text-align: justify; margin-bottom: 20px; }

.canva-embed-container {
  position: relative;
  width: 100%;
  height: 0;
  padding-top: 56.25%;
  margin-top: 40px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(255, 215, 0, 0.3);
}

.canva-embed-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

@media (max-width: 768px) {
  .header-nav { padding: 15px 20px; flex-direction: column; gap: 15px; }
  .header-logo-img { height: 50px; }
  .header-menu { flex-wrap: wrap; justify-content: center; gap: 10px; }
  .beyond-title, .coach-title { font-size: 26px; }
  .hero-text { font-size: 17px; }
}
  </style>
 </head>
 <body>
  <div class="app-shell">
   <header class="relative z-10 border-b border-[#ffd700]/30">
    <div class="content-frame !py-4 flex items-center justify-between">
     <div class="flex items-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-xl border border-[#ffd700]/70 bg-[#16001d] text-[#ffd700]">
       <i data-lucide="newspaper" class="w-5 h-5"></i>
      </div>
      <div>
       <p class="m-0 text-xs uppercase tracking-[.22em] text-[#ffd700]">YOU FIRST IDIOMAS</p>
       <h1 class="m-0 font-bold leading-tight text-white text-lg">Blog & Artigos</h1>
      </div>
     </div>
     <a href="index.html" class="action-button px-4 py-2 font-bold bg-[#ffd700] text-[#2c0439] text-sm">
       Voltar ao Início
     </a>
    </div>
   </header>

   <main class="relative z-10 content-frame">
     <div class="glass-panel rounded-2xl p-6 border border-[#ffd700]/50 my-6">
       <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
         
         <!-- WIDGET MENU LATERAL CON TÍTULOS -->
         <aside class="lg:col-span-4 bg-[#16001d]/90 rounded-xl p-4 border border-[#ffd700]/20 max-h-[650px] overflow-y-auto">
           <span class="text-xs font-bold text-[#ffd700] tracking-wider uppercase px-2 mb-3 block">Artigos Disponíveis</span>
           
           <div class="space-y-2" id="blog-menu-list">
             <!-- AQUÍ REGISTRAS LOS LINKS DE CADA ARTÍCULO DEL BLOG -->
             <button onclick="loadArticle('https://www.canva.com/design/DAHS23j1DyE/78dQC-WWSqnwmygSA8Fltg/view?embed', 'Artículo 1: Métodos de Aprendizaje', event)" class="blog-btn w-full text-left px-3 py-3 rounded-lg text-sm text-[#e2d1f0] hover:bg-[#ffd700]/10 hover:text-[#ffd700] flex items-center justify-between transition-all bg-[#ffd700]/10 text-[#ffd700]">
               <span>1. Métodos de Aprendizaje</span>
               <i data-lucide="chevron-right" class="w-4 h-4"></i>
             </button>

             <button onclick="loadArticle('URL_AQUI_2', 'Artículo 2: Connected Speech', event)" class="blog-btn w-full text-left px-3 py-3 rounded-lg text-sm text-[#e2d1f0] hover:bg-[#ffd700]/10 hover:text-[#ffd700] flex items-center justify-between transition-all">
               <span>2. Connected Speech</span>
               <i data-lucide="chevron-right" class="w-4 h-4 opacity-0"></i>
             </button>
           </div>
         </aside>

         <!-- VISOR PRINCIPAL DEL ARTÍCULO -->
         <main class="lg:col-span-8 flex flex-col">
           <h3 id="blog-article-title" class="text-xl font-bold text-white mb-4 flex items-center gap-2">
             <i data-lucide="book-open-check" class="w-5 h-5 text-[#ffd700]"></i> Artículo 1: Métodos de Aprendizaje
           </h3>
           
           <div class="relative w-full rounded-xl overflow-hidden border border-[#ffd700]/30 bg-[#16001d]" style="height: 600px;">
             <iframe id="blog-iframe" src="https://www.canva.com/design/DAHS23j1DyE/78dQC-WWSqnwmygSA8Fltg/view?embed" loading="lazy" class="w-full h-full border-0" allowfullscreen allow="fullscreen"></iframe>
           </div>
         </main>

       </div>
     </div>
   </main>

   <footer class="relative z-10 border-t border-[#ffd700]/25 mt-auto">
    <div class="content-frame !py-5 text-center text-sm text-[#e2d1f0]">
     &copy; You First Idiomas. Todos os direitos reservados.
    </div>
   </footer>
  </div>

  <script>
    function loadArticle(url, title, event) {
      const iframe = document.getElementById('blog-iframe');
      if (iframe) iframe.src = url;

      const titleElement = document.getElementById('blog-article-title');
      if (titleElement) {
        titleElement.innerHTML = `<i data-lucide="book-open-check" class="w-5 h-5 text-[#ffd700]"></i> ${title}`;
      }

      document.querySelectorAll('.blog-btn').forEach(btn => {
        btn.classList.remove('bg-[#ffd700]/10', 'text-[#ffd700]');
        const icon = btn.querySelector('i');
        if (icon) icon.classList.add('opacity-0');
      });

      if (event && event.currentTarget) {
        event.currentTarget.classList.add('bg-[#ffd700]/10', 'text-[#ffd700]');
        const activeIcon = event.currentTarget.querySelector('i');
        if (activeIcon) activeIcon.classList.remove('opacity-0');
      }

      if (window.lucide) lucide.createIcons();
    }

    if (window.lucide) lucide.createIcons();
  </script>
 </body>
</html>
