<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Aluno | You First Idiomas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Montserrat', sans-serif; 
      background-color: #2f0039; 
      color: #ffffff; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header-nav {
      width: 100%;
      background-color: #2c0439;
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ffd700;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-brand { display: flex; align-items: center; text-decoration: none; }
    .header-logo-img { height: 60px; width: auto; object-fit: contain; }

    .header-menu { display: flex; align-items: center; gap: 25px; list-style: none; }
    .nav-link {
      color: #ffffff; text-decoration: none; font-weight: 700; font-size: 19px;
      padding: 8px 16px; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.3s ease;
    }
    .nav-link:hover { color: #ffd700; }
    .nav-btn-highlight {
      background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
      color: #2c0439; font-weight: 800; border-radius: 25px; padding: 10px 22px; text-transform: uppercase;
    }

    .aluno-container {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #2c0439;
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 0, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    .login-title { font-size: 26px; color: #ffd700; font-weight: 800; margin-bottom: 10px; }
    .login-subtitle { font-size: 14px; color: #e2d1f0; margin-bottom: 25px; }

    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #ffd700; }

    .form-input {
      width: 100%; padding: 14px; border-radius: 10px;
      border: 1px solid rgba(255, 215, 0, 0.3); background: #1a0022;
      color: #ffffff; font-size: 16px; outline: none; transition: border-color 0.3s;
    }
    .form-input:focus { border-color: #ffd700; }

    .btn-login {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
      color: #2c0439; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 800; cursor: pointer; transition: transform 0.2s ease;
    }
    .btn-login:hover { transform: translateY(-2px); }

    .error-msg { color: #ff6b6b; font-size: 14px; margin-top: 15px; display: none; }

    .dashboard-section { display: none; width: 100%; text-align: center; }
    .dashboard-header { margin-bottom: 25px; }
    .dashboard-title { font-size: 32px; color: #ffd700; font-weight: 800; }

    .canva-dashboard-container {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 56.25%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 215, 0, 0.4);
    }

    .canva-dashboard-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 768px) {
      .header-nav { padding: 15px 20px; flex-direction: column; gap: 15px; }
      .header-logo-img { height: 50px; }
      .header-menu { flex-wrap: wrap; justify-content: center; gap: 10px; }
      .nav-link { font-size: 16px; }
    }
  </style>
</head>
<body>

  <header class="header-nav">
    <a href="index.html" class="header-brand">
      <img src="assets/logo.png" alt="You First Idiomas Logo" class="header-logo-img">
    </a>

    <nav>
      <ul class="header-menu">
        <li><a href="index.html#cursos" class="nav-link">Programas</a></li>
        <li><a href="#" class="nav-link">Blog</a></li>
        <li><a href="aluno.html" class="nav-link nav-btn-highlight">Área do Aluno</a></li>
      </ul>
    </nav>
  </header>

  <div class="aluno-container">
    <div class="login-card" id="loginCard">
      <h1 class="login-title">Portal do Aluno</h1>
      <p class="login-subtitle">Informe seu e-mail cadastrado para acessar o dashboard exclusivo.</p>
      
      <form id="loginForm" onsubmit="validarLogin(event)">
        <div class="form-group">
          <label for="emailInput">E-mail corporativo ou pessoal:</label>
          <input type="email" id="emailInput" class="form-input" placeholder="seuemail@exemplo.com" required>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">Entrar na Plataforma</button>
      </form>

      <p class="error-msg" id="errorMsg">E-mail não encontrado na base de alunos.</p>
    </div>

    <div class="dashboard-section" id="dashboardSection">
      <div class="dashboard-header">
        <h1 class="dashboard-title" id="welcomeGreeting">Welcome</h1>
      </div>

      <div class="canva-dashboard-container">
        <!-- Reemplaza el src con el link de Inserción/Embed de Canva -->
        <iframe 
          src="https://yfilink.my.canva.site/dashboard" 
          allowfullscreen="allowfullscreen" 
          allow="fullscreen">
        </iframe>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "URL_DE_TU_GOOGLE_APPS_SCRIPT";

    async function validarLogin(e) {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim().toLowerCase();
      const errorMsg = document.getElementById("errorMsg");
      const btnLogin = document.getElementById("btnLogin");

      errorMsg.style.display = "none";
      btnLogin.textContent = "Verificando...";
      btnLogin.disabled = true;

      try {
        if (GOOGLE_SCRIPT_URL === "URL_DE_TU_GOOGLE_APPS_SCRIPT") {
          mostrarDashboard("Aluno");
          return;
        }

        const response = await fetch(`${GOOGLE_SCRIPT_URL}?email=${encodeURIComponent(email)}`);
        const data = await response.json();

        if (data.autorizado) {
          mostrarDashboard(data.nombre || "Aluno");
        } else {
          errorMsg.style.display = "block";
        }
      } catch (err) {
        console.error(err);
        mostrarDashboard("Aluno");
      } finally {
        btnLogin.textContent = "Entrar na Plataforma";
        btnLogin.disabled = false;
      }
    }

    function mostrarDashboard(nombre) {
      document.getElementById("welcomeGreeting").textContent = `Welcome, ${nombre}!`;
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("dashboardSection").style.display = "block";
    }
  </script>
</body>
</html>
