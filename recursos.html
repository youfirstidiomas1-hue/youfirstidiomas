<!doctype html>
<html lang="pt-BR">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursos - English for Real Life | You First Idiomas</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --plum: #2c0439;
      --plum-deep: #16001d;
      --panel: rgba(20, 3, 29, .72);
      --gold: #ffd700;
      --lavender: #e2d1f0;
      --muted: #ad94bf;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      color: var(--lavender);
      background: #2c0439;
    }

    .app-shell {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 5%, rgba(255, 215, 0, .13), transparent 25rem),
        radial-gradient(circle at 87% 70%, rgba(158, 86, 195, .22), transparent 28rem),
        #2c0439;
    }

    .app-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .23;
      background-image:
        linear-gradient(rgba(255, 215, 0, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 215, 0, .07) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 70%);
    }

    .content-frame {
      position: relative;
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 26px 24px 42px;
    }

    .glass-panel {
      background: rgba(20, 3, 29, .72);
      border: 1px solid rgba(255, 215, 0, .58);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .24);
      backdrop-filter: blur(14px);
    }

    .nav-link {
      color: #e2d1f0;
      transition: color .2s ease, background .2s ease;
    }

    .nav-link:hover, .nav-link:focus-visible {
      color: #ffd700;
      background: rgba(255, 215, 0, .09);
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      min-height: 44px;
      border-radius: .7rem;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .action-button:hover { transform: translateY(-2px); filter: brightness(1.06); }

    .gold-line {
      width: 44px;
      height: 2px;
      background: #ffd700;
      border-radius: 99px;
    }

    .canva-embed-container {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 56.25%;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, .3);
    }

    @media (max-width: 640px) {
      .canva-embed-container {
        padding-top: 100%;
      }
    }

    .canva-embed-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
 </head>
 <body>
  <div class="app-shell">

      <div class="flex h-11 w-11 items-center justify-center rounded-xl border border-[#ffd700]/70 bg-[#16001d] text-[#ffd700]">
       <i data-lucide="book-open-check" class="w-5 h-5"></i>
      </div>
      <div>
       <p class="m-0 text-xs uppercase tracking-[.22em] text-[#ffd700]">YOU FIRST IDIOMAS</p>
       <h1 class="m-0 font-bold leading-tight text-white text-lg">Central de Recursos</h1>
      </div>
     </div>
     <nav aria-label="Navegação principal" class="flex flex-wrap items-center gap-1">
      <a class="nav-link rounded-lg px-3 py-2 text-sm font-medium" href="index.html">Início</a> 
      <a class="nav-link rounded-lg px-3 py-2 text-sm font-medium" href="challenge.html">Desafios</a> 
      <a class="nav-link rounded-lg px-3 py-2 text-sm font-medium" href="aluno.html">Área do Aluno</a>
      <a class="nav-link rounded-lg px-3 py-2 text-sm font-medium text-[#ffd700] bg-[#ffd700]/10" href="recursos.html">Recursos</a>
     </nav>
    </div>
   </header>

   <main class="relative z-10 content-frame">
    <section class="py-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
     <div>
      <div class="mb-2 flex items-center gap-3 text-[#ffd700]">
       <i data-lucide="sparkles" class="h-5 w-5"></i>
       <div class="gold-line"></div>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-white">English for Real Life</h1>
      <p class="mt-1 text-[#e2d1f0]">Acesse o material interativo, assista aos vídeos e pratique com os links externos abaixo.</p>
     </div>

     <div>
      <a href="https://www.canva.com/design/DAHS23j1DyE/78dQC-WWSqnwmygSA8Fltg/view?utm_content=DAHS23j1DyE&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener" class="action-button px-5 font-semibold border border-[#ffd700]/60 bg-[#16001d]/80 text-[#ffd700]">
       <i data-lucide="external-link" class="w-4 h-4"></i> Abrir em Tela Cheia
      </a>
     </div>
    </section>

    <section class="glass-panel rounded-2xl p-4 sm:p-6 mb-12">
     <div class="canva-embed-container">
      <iframe loading="lazy" src="https://www.canva.com/design/DAHS23j1DyE/78dQC-WWSqnwmygSA8Fltg/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
     </div>
    </section>
   </main>

   <footer class="relative z-10 border-t border-[#ffd700]/25 mt-auto">
    <div class="content-frame !py-5 text-center text-sm text-[#e2d1f0]">
     &copy; You First Idiomas. Todos os direitos reservados.
    </div>
   </footer>
  </div>
  <script>lucide.createIcons();</script>
 </body>
</html>
